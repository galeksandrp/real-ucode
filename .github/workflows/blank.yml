# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: BUILD
        run: git clone --depth=1 https://github.com/platomav/CPUMicrocodes.git
      - run: git clone --depth=1 https://github.com/AndyLavr/amd-ucodegen.git
      - run: git apply ../amd-ucodegen-tweak.diff
        working-directory: amd-ucodegen
      - run: make
        working-directory: amd-ucodegen
      - run: mv ../amd-ucodegen/amd-ucodegen .
        working-directory: CPUMicrocodes
      - run: source ../process-amd.sh
        working-directory: CPUMicrocodes
      - run: rm -rf CPUMicrocodes
      - run: rm -rf amd-ucodegen

      - name: STATUS
        run: git status
      - run: |
          grep CPUID index-amd-official.txt | head -1
          grep 00800F82 index-amd-official.txt
          grep 00800F82 index-amd.txt
          grep CPUID index-amd-official.txt | head -1
          grep 00A20F12 index-amd-official.txt
          grep 00A20F12 index-amd.txt
      - run: sha256sum microcode/amd-ucode/*.bin

      - name: PACKAGE RPM
        run: rpmbuild -ba real-ucode.spec

      - name: RPM TO DEB PACKAGE
        run: sudo apt-get update && sudo apt-get install -y alien
      - run: sudo alien build/noarch/amd-ucode-firmware-*.noarch.rpm
      - run: git status
      - run: echo git tag v0.1.0-master
      - run: cp amd-ucode-firmware_*_all.deb amd-ucode-firmware_latest_all.deb
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-master
          files: '*.deb'
      - run: sudo apt-get update && sudo apt-get install -y amd64-microcode
      - run: sha256sum /lib/firmware/amd-ucode/*.bin

      - name: TESTING DEB PACKAGE
        run: wget https://github.com/galeksandrp/real-ucode/releases/download/v0.1.0-master/amd-ucode-firmware_latest_all.deb && (sudo apt-get install -y ./amd-ucode-firmware_latest_all.deb || apt-get install -y ./amd-ucode-firmware_latest_all.deb)
      - run: find /lib/firmware/amd-ucode/. -maxdepth 1 -type f -print0 | LC_ALL=C sort -z | xargs -0 -r cat | sha256sum
